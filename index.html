<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1f" media="(prefers-color-scheme: dark)">
  <title>Learn Music Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <span class="logo" aria-label="Learn Music Notes" title="Learn Music Notes">♪</span>
    <select id="lib-piece" aria-label="Composition"></select>
    <select id="lib-exercise" aria-label="Exercise"></select>
    <button class="icon" id="lib-prev" title="Previous exercise" aria-label="Previous exercise">◀</button>
    <button class="icon" id="lib-next" title="Next exercise" aria-label="Next exercise">▶</button>
    <span class="muted" id="lib-count" hidden></span>
    <button class="icon orig-btn" id="top-play" title="Play the original" aria-label="Play the original">▶</button>
    <button class="icon orig-btn" id="top-hide" aria-pressed="false" title="Hide / show the original" aria-label="Hide or show the original">
      <svg class="eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
    </button>
    <div class="zoom" role="group" aria-label="Scale the notes">
      <button class="icon" id="zoom-out" title="Smaller notes" aria-label="Smaller notes">&minus;</button>
      <button id="zoom-reset" title="Reset scale" aria-label="Reset scale"></button>
      <button class="icon" id="zoom-in" title="Larger notes" aria-label="Larger notes">+</button>
    </div>
    <button class="icon orig-btn" id="fullscreen" title="Full screen: only the staves" aria-label="Full screen">⛶</button>
  </header>

  <div class="layout">
    <main>
      <div class="toolbar">
        <div class="group" id="tool-dur">
          <button class="icon" data-dur="w" title="Whole note (1)" aria-label="Whole note">
            <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="12" cy="12" rx="8" ry="5.2" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>
          </button>
          <button class="icon" data-dur="h" title="Half note (2)" aria-label="Half note">
            <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="9" cy="18" rx="5.6" ry="3.9" transform="rotate(-20 9 18)" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M14.3 16.4V3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          </button>
          <button class="icon" data-dur="q" title="Quarter note (3)" aria-label="Quarter note">
            <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="9" cy="18" rx="5.6" ry="3.9" transform="rotate(-20 9 18)" fill="currentColor"/><path d="M14.3 16.4V3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          </button>
          <button class="icon" data-dur="e" title="Eighth note (4)" aria-label="Eighth note">
            <svg viewBox="0 0 24 24" width="20" height="20"><ellipse cx="9" cy="18" rx="5.6" ry="3.9" transform="rotate(-20 9 18)" fill="currentColor"/><path d="M14.3 16.4V3c0 4 6 5 6 10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </button>
          <button class="icon" id="tool-dot" aria-pressed="false" title="Dotted: lasts 1.5x as long (.)" aria-label="Dotted">
            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="group" id="tool-acc">
          <button class="icon glyph" data-acc="#" aria-pressed="false" title="Sharp (Shift+3): for the notes you enter next">♯</button>
          <button class="icon glyph" data-acc="b" aria-pressed="false" title="Flat (Shift+4): for the notes you enter next">♭</button>
          <button class="icon glyph" data-acc="n" aria-pressed="false" title="Natural (Shift+5): for the notes you enter next">♮</button>
          <button class="icon" id="tool-lock" aria-pressed="false" title="Lock: keep the accidental for all the following notes (off: it is used up by one note)" aria-label="Lock accidental">
            <svg class="closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <svg class="open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
          </button>
        </div>
        <div class="group" id="tool-voice">
          <button class="icon voice-btn v1" data-voice="1" aria-pressed="true" title="Voice 1, the upper voice (Tab switches voice)" aria-label="Voice 1">1</button>
          <button class="icon voice-btn v2" data-voice="2" aria-pressed="false" title="Voice 2, the lower voice, played together with voice 1 (Tab switches voice)" aria-label="Voice 2">2</button>
        </div>
        <div class="group">
          <button class="icon" id="tool-rest" aria-pressed="false" title="Rest: clicking the staff adds a rest" aria-label="Rest">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2l6 7-6 6 6 6c-4-1-5 1-3 3"/></svg>
          </button>
        </div>
        <div class="group" id="tool-erase">
          <button class="icon" id="erase" aria-pressed="false" title="Erase: tap a note or a bar to delete it" aria-label="Erase">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h12"/><path d="M5.5 13.5L13 6a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11.5 19.5H8.3a2 2 0 0 1-1.4-.6l-1.4-1.4a2 2 0 0 1 0-2.8z"/><path d="M9 10l5 5"/></svg>
          </button>
          <button class="icon erase-opt" data-erase="note" aria-pressed="false" title="Erase a note" aria-label="Erase a note">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="8" cy="17" rx="4.6" ry="3.2" transform="rotate(-20 8 17)" fill="currentColor"/><path d="M12.4 15.6V4"/><path d="M15 5l5 5M20 5l-5 5"/></svg>
          </button>
          <button class="icon erase-opt" data-erase="bar" aria-pressed="false" title="Erase a whole bar" aria-label="Erase a bar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11h18M3 15h18M3 19h18"/><path d="M6 8v13M18 8v13"/><path d="M10 2l4 4M14 2l-4 4"/></svg>
          </button>
        </div>
        <div class="group right">
          <button class="icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <button class="icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          </button>
          <button class="icon" id="clear-mine" title="Clear my notes" aria-label="Clear my notes">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
          <button class="icon primary" id="check" title="Check my notes against the original" aria-label="Check">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
        </div>
        <div class="group full-only">
          <button class="icon" id="full-play" title="Play my notes" aria-label="Play my notes">▶</button>
          <button class="icon" id="full-zoom-out" title="Smaller notes" aria-label="Smaller notes">&minus;</button>
          <button class="icon" id="full-zoom-in" title="Larger notes" aria-label="Larger notes">+</button>
          <button class="icon" id="bar-mode" aria-pressed="false" title="One bar on the screen, split by dotted lines" aria-label="One bar view">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 6v12M15 6v12" stroke-dasharray="2 2.6"/></svg>
          </button>
          <button class="icon" id="board-pin" aria-pressed="false" title="Fix the position and the scale of the board" aria-label="Fix position and zoom">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v6"/><path d="M8.5 2.5h7l-1 6.5 3 3.5v2.5h-11v-2.5l3-3.5z"/></svg>
          </button>
          <button class="icon" id="full-exit" title="Leave full screen" aria-label="Leave full screen">✕</button>
        </div>
        <div class="group full-only" id="bar-tools">
          <button class="icon bar-opt" id="bar-prev" title="Previous bar" aria-label="Previous bar">◀</button>
          <span class="bar-opt" id="bar-label" aria-live="polite"></span>
          <button class="icon bar-opt" id="bar-next" title="Next bar" aria-label="Next bar">▶</button>
          <select class="bar-opt" id="grid-size" title="Split size: where the dotted lines are" aria-label="Split size"></select>
        </div>
      </div>

      <div id="cards"></div>
      <section id="result" class="card"></section>

      <section class="card keyboard" id="keyboard" hidden>
        <div class="kb-head">
          <h2>Keyboard</h2>
          <div class="kb-oct">
            <button class="icon" id="oct-down" title="Lower all three octaves by one" aria-label="Lower octaves">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <span id="oct-label" class="muted"></span>
            <button class="icon" id="oct-up" title="Raise all three octaves by one" aria-label="Raise octaves">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
            </button>
          </div>
        </div>
        <div id="kb-rows"></div>
      </section>
    </main>

    <!-- Notes list and JSON editor: hidden for now (see the aside rule in styles.css) -->
    <aside hidden>
      <section class="card">
        <h2>Notes <small id="notes-target"></small></h2>
        <ul id="note-list"></ul>
        <button id="add-note">+ Add note</button>
      </section>
      <section class="card">
        <h2>JSON <small id="json-target"></small></h2>
        <textarea id="json" spellcheck="false" rows="14"></textarea>
        <ul id="json-errors" class="lint bad"></ul>
        <div class="row">
          <button id="json-apply" class="primary">Apply</button>
          <button id="json-copy">Copy</button>
          <button id="json-download">Download</button>
          <label class="button">Load file<input id="json-file" type="file" accept=".json,application/json" hidden></label>
        </div>
      </section>
    </aside>
  </div>

  <template id="card-tpl">
    <section class="card score-card">
      <header>
        <h2><span class="dot"></span><span class="label"></span></h2>
        <div class="meta">
          <input data-meta="title" aria-label="Title">
          <select data-meta="clef" aria-label="Clef"></select>
          <select data-meta="key" aria-label="Key"></select>
          <select data-meta="time" aria-label="Time signature"></select>
          <label class="tempo">♩ = <input data-meta="tempo" type="number" min="20" max="300"></label>
        </div>
        <div class="card-actions">
          <button data-act="play">▶ Play</button>
          <button data-act="hide" data-only="original"></button>
        </div>
      </header>
      <div class="staff"></div>
      <ul class="lint"></ul>
    </section>
  </template>

  <script type="module" src="src/app.js"></script>
</body>
</html>
